<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="google-site-verification" content="OyRIaQy2F8JBwAYxY0sYj-t11662LDSymvvlNdRiH6U" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AB%3C/text%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0e12" />

    <!-- ── SEO ──────────────────────────────────────────────────────────
         This is an SPA that serves the same index.html shell for every route.
         Split of responsibility:
           - The <title>, description, and canonical below are the static
             HOMEPAGE baseline (and the no-JS fallback for every route). At
             runtime, <Seo> (src/components/Seo.jsx) MUTATES these exact nodes
             per route, so there is always exactly one — never a duplicate or
             conflicting canonical.
           - The og/twitter/JSON-LD are the static social baseline at homepage
             values, keeping root (tikcal.nyc/) social unfurls intact without JS.
             Interior deep-link unfurls show this homepage card until build-time
             prerendering is added. -->
    <title>TikCal — NYC Concert Discovery & Group Availability</title>
    <meta
      name="description"
      content="Discover upcoming NYC concerts and see when your crew is actually free. TikCal pairs concert discovery with group availability, RSVPs, and shared calendars for nights out in New York City."
    />
    <link rel="canonical" href="https://tikcal.nyc/" />

    <!-- Open Graph (static homepage/social baseline) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TikCal" />
    <meta property="og:title" content="TikCal — NYC Concert Discovery & Group Availability" />
    <meta
      property="og:description"
      content="Discover upcoming NYC concerts and see when your crew is free. Concert discovery, group availability, RSVPs, and shared calendars for New York City nights out."
    />
    <meta property="og:url" content="https://tikcal.nyc/" />
    <meta property="og:image" content="https://tikcal.nyc/discoball.png" />
    <meta property="og:image:alt" content="TikCal — a disco ball over an NYC concert calendar" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TikCal — NYC Concert Discovery & Group Availability" />
    <meta
      name="twitter:description"
      content="Discover upcoming NYC concerts and see when your crew is free. Concert discovery, group availability, RSVPs, and shared calendars for NYC nights out."
    />
    <meta name="twitter:image" content="https://tikcal.nyc/discoball.png" />
    <!-- twitter:site / twitter:creator omitted until a real @handle is confirmed. -->

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "TikCal",
        "url": "https://tikcal.nyc/",
        "description": "NYC concert discovery app that surfaces upcoming shows and shows when your crew is free — group availability, RSVPs, and shared calendars for nights out in New York City.",
        "applicationCategory": "LifestyleApplication",
        "operatingSystem": "Web, iOS, Android",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
    <!-- NOTE: add "sameAs": [ ...social profile URLs... ] to the block above
         once the real Instagram/X handles are confirmed. -->
    <!-- ─────────────────────────────────────────────────────────────── -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@1,800&family=Syne:wght@600;700;800&family=Schibsted+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
